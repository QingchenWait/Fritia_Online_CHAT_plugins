name: Label character card submissions

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply the character-card label
        uses: actions/github-script@v7
        with:
          script: |
            // User submissions remain unreviewed. This workflow only assigns
            // the submission category, never the approval or featured labels.
            const issue = context.payload.issue;
            const body = issue.body || '';
            const headings = ['角色卡名称', '角色卡介绍', '头像', '人格提示词', '参考语音', '必要上传声明', '可选声明'];
            if (!issue.title.startsWith('[角色卡投稿] ')) return;
            if (!headings.every(heading => body.includes(`### ${heading}\n`))) return;
            if (issue.labels.some(label => label.name === '角色卡')) return;
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: '角色卡', color: 'd9b5ce', description: '社区角色卡投稿，等待审核' });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: ['角色卡'] });
